<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free and open-source apps for Windows and Linux, with a ready-to-run install script." />
    <title>FOSSLove</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem("fosslove-theme");
        } catch (error) {
          stored = null;
        }
        var theme = stored === "light" || stored === "dark" ? stored : "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
